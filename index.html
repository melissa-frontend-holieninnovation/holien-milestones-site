<div id="tip"></div>
<script>
const tip = document.getElementById('tip');
function show(ev, raw) {
  let d;
  try { d = JSON.parse(raw); } catch (e) { return; }
  const rows = (d.rows || []).map(r =>
    '<div class="row"><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>'
  ).join('');
  const sell = d.sell ? '<div class="sell">Reviewing flow = OEM / SO-PO UX audit · code review/test = ticket Status</div>' : '';
  const note = d.note ? '<div class="sell">' + d.note + '</div>' : '';
  const open = d.url ? '<div class="open">Click to open Notion ticket</div>' : '<div class="open">No Notion ticket yet</div>';
  tip.innerHTML = '<h4>' + (d.name || '') + '</h4>'
    + '<div class="meta">check ' + (d.ver || '') + ' · ' + (d.span || '') + '</div>'
    + (rows || '<div class="meta">No stage days on this bar</div>')
    + sell
    + note
    + open;
  tip.style.display = 'block';
  move(ev);
}
function move(ev) {
  const pad = 14;
  let x = ev.clientX + pad;
  let y = ev.clientY + pad;
  const r = tip.getBoundingClientRect();
  if (x + r.width > window.innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > window.innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + 'px';
  tip.style.top = Math.max(8, y) + 'px';
}
function hide() { tip.style.display = 'none'; }
document.querySelectorAll('.feat').forEach(g => {
  g.addEventListener('mouseenter', ev => show(ev, g.getAttribute('data-tip')));
  g.addEventListener('mousemove', move);
  g.addEventListener('mouseleave', hide);
  g.addEventListener('click', ev => {
    const url = g.getAttribute('data-url');
    if (!url) return;
    ev.preventDefault();
    ev.stopPropagation();
    window.open(url, '_blank', 'noopener');
  });
});
</script>
